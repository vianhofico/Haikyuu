name: Unity build, smoke and Android APK

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

jobs:
  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source/data invariants
        run: python3 Tools/validate_repo.py

  unity-linux-smoke:
    name: Unity 6.3 Linux headless smoke
    needs: repository-sanity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Unity license configuration
        id: license
        shell: bash
        run: |
          personal=false
          professional=false
          if [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            personal=true
          fi
          if [[ -n "$UNITY_SERIAL" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            professional=true
          fi
          if [[ "$personal" == "true" || "$professional" == "true" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity CI license configuration detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unity smoke build skipped. Configure UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD for Personal, or UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD for Pro."
          fi

      - name: Build Linux smoke player with Unity 6.3
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-builder@v5.0.0
        with:
          unityVersion: 6000.3.0f1
          targetPlatform: StandaloneLinux64
          buildName: HaikyuuSmoke
          buildsPath: build
          buildMethod: HaikyuuGame.Editor.CiBuild.BuildLinuxSmoke
          allowDirtyBuild: true

      - name: Run game headlessly
        if: steps.license.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          executable="$(find build -type f -name 'HaikyuuSmoke.x86_64' -print | sort | head -n 1)"
          if [[ -z "$executable" || ! -f "$executable" ]]; then
            echo "::error::Linux smoke executable was not found under build/."
            find build -maxdepth 5 -type f -print || true
            exit 1
          fi

          chmod +x "$executable"

          # Unity standalone players still require a valid X display on Linux even
          # when launched for an automated smoke test. GitHub-hosted runners do not
          # expose one, so provide a disposable virtual display instead of relying
          # on -nographics (which was failing with "Authorization failed!").
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi

          rm -f smoke-player.log
          set +e
          timeout -k 5s 45s xvfb-run -a -s "-screen 0 1280x720x24" \
            "$executable" \
            -batchmode \
            -logFile "$PWD/smoke-player.log" \
            -ciSmoke
          smoke_exit=$?
          set -e

          echo "--- smoke-player.log ---"
          cat smoke-player.log || true
          echo "--- end smoke-player.log ---"

          if [[ $smoke_exit -eq 124 || $smoke_exit -eq 137 ]]; then
            echo "::error::Smoke player did not exit within the 45 second timeout."
            exit 1
          fi
          if [[ $smoke_exit -ne 0 ]]; then
            echo "::error::Smoke player exited with code $smoke_exit."
            exit "$smoke_exit"
          fi
          if [[ ! -s smoke-player.log ]]; then
            echo "::error::Smoke player produced no log."
            exit 1
          fi
          if grep -q "CI_SMOKE_FAIL" smoke-player.log; then
            echo "::error::Runtime smoke probe reported CI_SMOKE_FAIL."
            exit 1
          fi
          if ! grep -q "CI_SMOKE_PASS" smoke-player.log; then
            echo "::error::Runtime smoke probe never reported CI_SMOKE_PASS."
            exit 1
          fi

          echo "Unity Linux runtime smoke passed."

      - name: Upload smoke log
        if: always() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-smoke-log
          path: smoke-player.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Linux smoke build
        if: success() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Haikyuu-Linux-Smoke
          path: build
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Android development APK
    needs: repository-sanity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Unity license configuration
        id: license
        shell: bash
        run: |
          personal=false
          professional=false
          if [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            personal=true
          fi
          if [[ -n "$UNITY_SERIAL" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            professional=true
          fi
          if [[ "$personal" == "true" || "$professional" == "true" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Unity CI license configuration detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android APK build skipped. Configure UNITY_LICENSE + UNITY_EMAIL + UNITY_PASSWORD for Personal, or UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD for Pro."
          fi

      - name: Build Android APK with Unity 6.3
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-builder@v5.0.0
        with:
          unityVersion: 6000.3.0f1
          targetPlatform: Android
          buildName: Haikyuu
          buildsPath: build
          buildMethod: HaikyuuGame.Editor.CiBuild.BuildAndroidApk
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Verify APK
        if: steps.license.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # With a custom buildMethod GameCI can preserve the path chosen by Unity
          # under a nested build directory. Do not assume one host-side depth.
          apk="$(find build -type f -name '*.apk' -print | sort | head -n 1)"
          if [[ -z "$apk" || ! -f "$apk" ]]; then
            echo "::error::No APK generated anywhere under build/."
            find build -maxdepth 6 -print || true
            exit 1
          fi

          canonical_apk="build/Android/Haikyuu.apk"
          mkdir -p "$(dirname "$canonical_apk")"
          if [[ "$apk" != "$canonical_apk" ]]; then
            echo "APK generated at $apk; normalizing artifact path to $canonical_apk"
            cp "$apk" "$canonical_apk"
          fi

          test -s "$canonical_apk"
          ls -lh "$canonical_apk"
          sha256sum "$canonical_apk" | tee "$canonical_apk.sha256"
          echo "APK verified: $canonical_apk ($(stat -c%s "$canonical_apk") bytes)"

      - name: Upload Android APK
        if: success() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Haikyuu-Android-APK
          path: |
            build/Android/Haikyuu.apk
            build/Android/Haikyuu.apk.sha256
          if-no-files-found: error
          retention-days: 14

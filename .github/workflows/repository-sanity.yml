name: Repository sanity

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository structure and roster
        run: python Tools/validate_repo.py
